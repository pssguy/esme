<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esme's Wonderland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --forest:#123a2a; --wood:#8a5428; --wood-dark:#4d2c12; --wood-light:#e9b46a;
  --panel-bg:#fff4dc; --panel-ink:#4a2a12; --panel-sub:#7a5332; --stat-bg:rgba(138,84,40,.12);
  --scrim:rgba(8,30,20,.58);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--forest);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --forest:#0b2219; --panel-bg:#2e1f13; --panel-ink:#ffecc9; --panel-sub:#dcbc92; --stat-bg:rgba(255,220,170,.08);
    --scrim:rgba(0,0,0,.66); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --forest:#0b2219; --panel-bg:#2e1f13; --panel-ink:#ffecc9; --panel-sub:#dcbc92; --stat-bg:rgba(255,220,170,.08);
  --scrim:rgba(0,0,0,.66); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--forest);color:var(--panel-ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
button{font-family:var(--font)}
:focus-visible{outline:3px solid #ffd84d;outline-offset:4px}

/* HUD */
.hud{position:absolute;top:10px;left:10px;right:10px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
body[data-mode="playing"] .hud,body[data-mode="paused"] .hud,body[data-mode="falling"] .hud,
body[data-mode="levelDone"] .hud,body[data-mode="over"] .hud{display:flex}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:58px;height:58px;border-radius:16px;object-fit:cover;background:#f6c33b;
  box-shadow:0 0 0 3px #ffd84d,0 0 0 6px #8b4fd6,0 0 0 8px #4f2296,0 6px 12px 6px rgba(0,0,0,.3)}
.bars{display:grid;gap:7px}
.hearts{display:flex;gap:3px;padding:4px 9px;border-radius:999px;background:linear-gradient(#72dd66,#2f9d3d);
  box-shadow:0 0 0 3px var(--wood-light),0 0 0 6px #7a4a22,0 4px 8px 6px rgba(0,0,0,.25)}
.heart{width:20px;height:20px;fill:#5b2a1a;transition:transform .2s}
.heart.full{fill:#ff3d6e;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.coins{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:rgba(40,20,8,.6);color:#fff;
  font:600 18px/1 var(--font);padding:3px 12px 3px 3px;border-radius:999px}
.coin-ico{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f6c33b 55%,#c98a12);box-shadow:inset 0 0 0 2px #e0a21a}
.hud-right{display:flex;gap:8px;align-items:center;pointer-events:auto}
.chip{font:600 16px/1 var(--font);color:#fff;background:rgba(40,20,8,.6);padding:8px 12px;border-radius:999px;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(#c98a4b,#8a5428);box-shadow:0 0 0 3px var(--wood-light),0 4px 0 3px var(--wood-dark)}
.icon-btn svg{width:22px;height:22px;fill:#fff4dc;stroke:#fff4dc}

/* Controls */
.controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:6}
body[data-mode="playing"] .controls{display:block}
.dpad{position:absolute;left:12px;bottom:10px;width:150px;height:150px;pointer-events:auto;touch-action:none}
.dpad svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.actions{position:absolute;right:16px;bottom:16px;width:176px;height:176px;pointer-events:none}
.act{position:absolute;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;pointer-events:auto;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 35% 28%,var(--hi),var(--base) 58%,var(--lo));
  box-shadow:0 0 0 5px var(--wood-light),0 0 0 9px #7a4a22,0 7px 0 9px var(--wood-dark),0 12px 18px 9px rgba(0,0,0,.35)}
.act:active,.act.held{transform:translateY(3px);box-shadow:0 0 0 5px var(--wood-light),0 0 0 9px #7a4a22,0 4px 0 9px var(--wood-dark),0 8px 14px 9px rgba(0,0,0,.35)}
.act svg{width:60%;height:60%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.act::before{content:"";position:absolute;inset:-15px;border-radius:50%;opacity:0;transition:opacity .2s;
  background:conic-gradient(var(--ring) calc(var(--fill,100) * 1%),rgba(255,255,255,.12) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.act.partial::before{opacity:1}
#runBtn{--base:#3fbf4a;--hi:#a6f594;--lo:#1f7a2a;--ring:#b6ff8f;width:66px;height:66px;top:0;right:12px}
#runBtn.tired{--base:#7d9a7f;--hi:#c2d6c3;--lo:#4a5f4c}
#shrinkBtn{--base:#e24848;--hi:#ff9a8a;--lo:#97211f;width:66px;height:66px;bottom:12px;left:0}
#shrinkBtn[aria-pressed="true"]{--base:#ff6fb5;--hi:#ffd0e8;--lo:#b02a6e}
#wandBtn{--base:#8b4fd6;--hi:#dcb6ff;--lo:#4f2296;--ring:#f3d1ff;width:86px;height:86px;bottom:0;right:0}
#wandBtn.empty svg{opacity:.45}
.pips{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.pip.on{background:#ffd84d;box-shadow:0 0 4px #ffd84d}

/* Banner */
.banner{position:absolute;left:50%;top:17%;transform:translate(-50%,-180%);opacity:0;pointer-events:none;z-index:8}
.banner.go{animation:drop 2.9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes drop{0%{transform:translate(-50%,-180%);opacity:0}18%{transform:translate(-50%,0);opacity:1}
  78%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-180%);opacity:0}}
.sign{text-align:center;white-space:nowrap;padding:14px 30px 12px;border-radius:26px;background:linear-gradient(#cf9150,#9a5d2b);
  box-shadow:inset 0 0 0 4px var(--wood-light),0 0 0 5px #6b3d18,0 10px 0 5px var(--wood-dark),0 18px 30px rgba(0,0,0,.4)}
.candy{display:block;font:700 48px/1.05 var(--font);letter-spacing:.5px;color:transparent;
  background:linear-gradient(90deg,#ff5fae,#ffd84d 35%,#5fe07a 62%,#3fbde8);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 5px 0 #6b3d18)}
.sign small{display:block;margin-top:8px;color:#fff4dc;font:600 18px/1 var(--font);text-shadow:0 2px 0 #6b3d18}

/* Overlays */
.overlay{position:absolute;inset:0;display:none;place-items:center;background:var(--scrim);padding:20px;z-index:20}
.overlay.show{display:grid}
.card{width:100%;max-width:370px;text-align:center;background:var(--panel-bg);color:var(--panel-ink);border-radius:28px;padding:26px 22px 22px;
  box-shadow:0 0 0 7px var(--wood-light),0 0 0 13px var(--wood),0 14px 0 13px var(--wood-dark),0 26px 44px 12px rgba(0,0,0,.45)}
.card h2{margin:0 0 4px;font:700 30px/1.1 var(--font)}
.card p{margin:6px 0;font:500 17px/1.4 var(--font);color:var(--panel-sub)}
.card .aside{font-style:italic}
.stats{display:flex;justify-content:center;gap:8px;margin:16px 0 10px}
.stat{background:var(--stat-bg);border-radius:14px;padding:8px 6px;min-width:88px}
.stat b{display:block;font:700 24px/1.1 var(--font);color:var(--panel-ink)}
.stat span{font-size:14px;color:var(--panel-sub)}
.btn{display:block;margin:14px auto 0;font:600 21px/1 var(--font);color:#fff;border:0;border-radius:999px;padding:15px 34px;cursor:pointer;
  background:linear-gradient(#72dd66,#2f9d3d);box-shadow:0 0 0 4px rgba(255,255,255,.55),0 6px 0 4px #1d6b29;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 4px rgba(255,255,255,.55),0 3px 0 4px #1d6b29}
.btn.alt{background:linear-gradient(#62d2ff,#2a8fd0);box-shadow:0 0 0 4px rgba(255,255,255,.55),0 6px 0 4px #1c5f8c}
.btn[hidden]{display:none}
.btn.quiet{background:none;box-shadow:none;color:var(--panel-sub);font-size:17px;padding:8px 14px;text-decoration:underline;text-shadow:none;margin-top:8px}

/* Title */
.title{grid-template-rows:minmax(0,1fr) auto;place-items:stretch;padding:0;background:#0d281d;overflow:hidden}
.title-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(20px) brightness(.5)}
.title-art{position:relative;display:block;width:100%;height:100%;min-height:0;object-fit:contain;object-position:center bottom}
.title-panel{position:relative;display:grid;justify-items:center;gap:4px;padding:6px 20px 20px;color:#fff4dc;text-align:center}
.title-panel .btn{margin-top:8px;font-size:24px;padding:16px 46px}
.title-panel p{margin:10px 0 0;max-width:34em;font:500 16px/1.45 var(--font);color:#f3e2c2}
.title-panel .keys{font-size:14px;color:#cbb898;margin-top:4px}
@media (pointer:coarse){.title-panel .keys{display:none}}
@media (max-width:440px){.chip{display:none}}
@media (max-height:520px){.title-panel p{display:none}}
@media (prefers-reduced-motion: reduce){
  .banner.go{animation:fade 2.6s linear forwards}
  @keyframes fade{0%,100%{opacity:0;transform:translate(-50%,0)}15%,80%{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>

const QUIPS = ["We're all a bit mad here. The cards more than most.", 'Tarts put hearts back. Just don\'t tell the Queen.', "I'd help, but today I'm mostly a grin.", 'The Rabbit always knows the way. He just never stops complaining about it.', 'The wand needs a few seconds between waves. So do I.'];
const DONE_LINES = ['Curiouser and curiouser.', "The Rabbit says thank you, then says he's late again.", 'Nobody saw the cards fold. Nobody will ask.', 'Somewhere a Duchess is still waiting. Not your problem.'];
const SPARK = ['#fff6b0', '#ffd84d', '#ff9ad5', '#c9a2ff', '#9ff3ff'];
const CONFETTI = ['#ff3d6e', '#ffd84d', '#5fe07a', '#3fbde8', '#c9a2ff', '#ffffff'];
const HEART = 'M12 21s-7-4.4-9.5-9C.8 8.6 2.6 4.5 6.5 4.5c2.2 0 3.6 1.3 4.5 2.6.9-1.3 2.3-2.6 4.5-2.6 3.9 0 5.7 4.1 4 7.5C19 16.6 12 21 12 21z';

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = Math.random;
const R = (a, b) => a + rnd() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const pickM = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const store = {
  get(k, d){ try { const v = localStorage.getItem('esme-wl-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('esme-wl-' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- audio ---------- */
let actx = null, muted = store.get('muted', false), lastCoinSfx = 0;
function audioInit(){ if (actx) { if (actx.state === 'suspended') actx.resume(); return; } try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(freq, dur, type, vol, slideTo, delay){
  if (!actx || muted) return;
  const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .03);
}
const sfx = {
  coin(){ const n = performance.now(); if (n - lastCoinSfx < 50) return; lastCoinSfx = n; tone(988, .07, 'square', .05); tone(1319, .12, 'square', .05, null, .06); },
  zap(){ tone(1700, .4, 'sawtooth', .06, 220); tone(2600, .3, 'sine', .06, 700, .05); },
  hurt(){ tone(320, .32, 'square', .09, 90); },
  shrink(){ tone(950, .3, 'sine', .12, 300); },
  grow(){ tone(300, .3, 'sine', .12, 950); },
  heal(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .1, null, i * .08)); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .24, 'triangle', .1, null, i * .1)); },
  lose(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .32, 'triangle', .1, null, i * .18)); },
  nope(){ tone(180, .14, 'square', .06); },
  purr(){ tone(90, .5, 'sawtooth', .03, 70); }
};

/* ---------- state ---------- */
const S = { mode: 'title', level: 1, coins: 0, hearts: MAXH, levelStartCoins: 0, levelStartHearts: MAXH, t: 0, fallT: 0 };
let world = null, W = 3000, H = 1100;
let hedges = [], doors = [], mushrooms = [], guards = [], coins = [], tarts = [], cats = [], decor = [], path = [], hole = null, tops = [], bottoms = [], patches = [];
let particles = [], floaters = [], rings = [], fireflies = [];
const player = { x: 0, y: 0, scale: 1, small: false, facing: 1, walk: 0, moving: false, running: false, tired: false, stam: 100, wand: 3, wandT: 0, inv: 0, say: null };
let rabbit = null;
const cam = { x: 0, y: 0 };
let vw = 0, vh = 0, dpr = 1, zoom = 1, vignette = null, glow = null, shake = 0;

function setMode(m){ S.mode = m; document.body.dataset.mode = m; }

/* ---------- level generation ---------- */
function buildLevel(level){
  rnd = mulberry32(level * 7919 + 13);
  const w = 2600 + level * 700, h = 1100;
  const nearRows = [];
  const rows = [];
  let x = 620, idx = 0;
  while (x < w - 700) {
    let type;
    if (level === 1) type = idx === 1 ? 'tiny' : 'open';
    else type = rnd() < 0.35 + Math.min(0.2, level * 0.03) ? 'tiny' : 'open';
    const gh = type === 'tiny' ? 96 : 190;
    rows.push({ x, type, gy: R(170, h - 170 - gh), gh });
    x += R(570, 720); idx++;
  }
  const nearHedge = (px, pad) => rows.some(r => px > r.x - pad && px < r.x + HW + pad);

  const hd = [], dr = [];
  hd.push({ x: -HW, y: -40, w: HW, h: h + 80 }, { x: w, y: -40, w: HW, h: h + 80 });
  for (const r of rows) {
    hd.push({ x: r.x, y: -40, w: HW, h: r.gy + 40 });
    hd.push({ x: r.x, y: r.gy + r.gh, w: HW, h: h + 40 - (r.gy + r.gh) });
    if (r.type === 'tiny') dr.push({ x: r.x, y: r.gy, w: HW, h: r.gh });
  }
  for (const b of hd) {
    b.roses = [];
    const n = Math.floor(b.h / 75);
    for (let i = 0; i < n; i++) b.roses.push({ x: R(12, HW - 12), y: b.y + R(20, b.h - 20), c: rnd() < 0.7 ? '#e0263f' : '#fffaf0' });
  }

  const pth = [{ x: 110, y: h / 2 }];
  for (const r of rows) { const cy = r.gy + r.gh / 2; pth.push({ x: r.x - 90, y: cy }, { x: r.x + HW + 90, y: cy }); }
  const hl = { x: w - 210, y: R(260, h - 260), r: 56 };
  pth.push({ x: hl.x, y: hl.y });
  const distPath = (px, py) => {
    let m = 1e9;
    for (let i = 0; i < pth.length - 1; i++) {
      const a = pth[i], b = pth[i + 1], dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
      let t = l ? ((px - a.x) * dx + (py - a.y) * dy) / l : 0; t = clamp(t, 0, 1);
      m = Math.min(m, Math.hypot(a.x + t * dx - px, a.y + t * dy - py));
    }
    return m;
  };

  const shroomCols = [{ c: '#d9363e', hi: '#ff8070' }, { c: '#e8762c', hi: '#ffb86e' }, { c: '#d64d8e', hi: '#ff9ccc' }];
  const ms = []; let tries = 0;
  while (ms.length < 10 + level * 3 && tries++ < 900) {
    const m = { x: R(260, w - 320), y: R(120, h - 110), r: R(34, 60) };
    if (nearHedge(m.x, m.r + 30) || distPath(m.x, m.y) < m.r + 80 || dist(m.x, m.y, hl.x, hl.y) < m.r + 160) continue;
    if (ms.some(o => dist(o.x, o.y, m.x, m.y) < o.r + m.r + 40)) continue;
    Object.assign(m, pick(shroomCols));
    m.spots = []; const ns = RI(3, 5);
    for (let i = 0; i < ns; i++) m.spots.push({ x: R(-0.6, 0.6), y: R(-0.55, -0.15), r: R(0.08, 0.15) });
    ms.push(m);
  }

  const gs = []; tries = 0;
  const suits = ['♥', '♠', '♦', '♣'];
  while (gs.length < 2 + level * 2 && tries++ < 1200) {
    const vert = rnd() < 0.55, len = R(180, 340);
    const ax = R(540, w - 420), ay = R(130, h - 130 - (vert ? len : 0));
    const bx = vert ? ax : ax + len, by = vert ? ay + len : ay;
    if (bx > w - 320) continue;
    if (rows.some(r => Math.max(ax, bx) > r.x - 55 && Math.min(ax, bx) < r.x + HW + 55)) continue;
    let ok = true;
    for (let k = 0; k <= 6 && ok; k++) { const px = ax + (bx - ax) * k / 6, py = ay + (by - ay) * k / 6; if (ms.some(m => dist(m.x, m.y, px, py) < m.r + 30)) ok = false; }
    if (!ok || gs.some(g => dist(g.ax, g.ay, ax, ay) < 170)) continue;
    gs.push({ ax, ay, bx, by, t: rnd(), dir: rnd() < .5 ? 1 : -1, speed: (55 + level * 9) / len, x: ax, y: ay,
      suit: pick(suits), rank: pick(['2', '3', '5', '7', '9', '10', 'J']), zap: 0, gone: false, facing: 1, step: rnd() * 6, say: null });
  }

  const cs = [];
  for (let i = 0; i < pth.length - 1; i++) {
    const a = pth[i], b = pth[i + 1], L = dist(a.x, a.y, b.x, b.y), n = Math.floor(L / 115);
    for (let k = 1; k < n; k++) {
      if (rnd() < 0.3) continue;
      const t = k / n, px = a.x + (b.x - a.x) * t, py = a.y + (b.y - a.y) * t;
      if (nearHedge(px, 30) || dist(px, py, hl.x, hl.y) < 90) continue;
      cs.push({ x: px, y: py, ph: rnd() * 6, got: false, magnet: false });
    }
  }
  tries = 0; let clusters = 0;
  while (clusters < 4 + level && tries++ < 500) {
    const cx = R(320, w - 320), cy = R(150, h - 150);
    if (nearHedge(cx, 90) || ms.some(m => dist(m.x, m.y, cx, cy) < m.r + 90) || distPath(cx, cy) < 120) continue;
    const n = RI(5, 7);
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; cs.push({ x: cx + Math.cos(a) * 44, y: cy + Math.sin(a) * 44, ph: rnd() * 6, got: false, magnet: false }); }
    clusters++;
  }

  const ts = []; tries = 0;
  while (ts.length < 1 + (level >= 3 ? 1 : 0) && tries++ < 400) {
    const tx = R(500, w - 400), ty = R(150, h - 150);
    if (nearHedge(tx, 70) || ms.some(m => dist(m.x, m.y, tx, ty) < m.r + 60) || distPath(tx, ty) < 150) continue;
    ts.push({ x: tx, y: ty, got: false, ph: rnd() * 6 });
  }

  const ct = [];
  const tinyRow = rows.find(r => r.type === 'tiny');
  const quips = QUIPS.slice();
  if (tinyRow) ct.push({ x: tinyRow.x + HW / 2, y: Math.max(95, tinyRow.gy - 105), a: 0, state: 0, t: 0, say: null,
    text: level === 1 ? 'Little doors are for little girls. Tap the red bottle to shrink.' : 'Another little door. You know the trick by now.' });
  const midRow = rows[Math.min(rows.length - 1, 2)];
  if (midRow && midRow !== tinyRow) ct.push({ x: midRow.x + HW / 2, y: Math.min(h - 95, midRow.gy + midRow.gh + 105), a: 0, state: 0, t: 0, say: null,
    text: level === 1 ? 'Card guards fold if you wave the wand at them. Most things do.' : pick(quips) });

  const dc = [];
  const nDecor = Math.floor(w * h / 8500);
  for (let i = 0; i < nDecor; i++) {
    const px = R(0, w), py = R(70, h - 50);
    if (nearHedge(px, 8)) continue;
    const k = rnd();
    dc.push({ x: px, y: py, k: k < .55 ? 'tuft' : k < .88 ? 'flower' : 'shroom', c: pick(['#ff7ab6', '#b77bff', '#ffd23f', '#6fd3ff', '#ffffff', '#ff8a5c']), s: R(.7, 1.3) });
  }
  dc.sort((a, b) => a.x - b.x);

  const tp = []; x = -140;
  while (x < w + 160) { tp.push({ x, r: R(58, 84), c: pick(['#1b5a2f', '#1f6634', '#174f29']) }); x += R(90, 140); }
  const bt = []; x = -100;
  while (x < w + 120) { bt.push({ x, r: R(38, 58), c: pick(['#1c5f30', '#22703a', '#195528']), f: rnd() < .35 ? pick(['#ff7ab6', '#c58bff', '#ffd23f']) : null }); x += R(60, 95); }
  const pt = [];
  for (let i = 0; i < w / 260; i++) pt.push({ x: R(0, w), y: R(80, h - 80), r: R(130, 270) });

  const palettes = [['#62bd5f', '#3f9a4a'], ['#5cb86c', '#3a9152'], ['#6ab955', '#47923f'], ['#4fa66a', '#2e7b4e'], ['#62b25c', '#3f8c46']];
  const pal = palettes[(level - 1) % palettes.length];
  const gg = ctx.createLinearGradient(0, 0, 0, h);
  gg.addColorStop(0, pal[1]); gg.addColorStop(0.5, pal[0]); gg.addColorStop(1, pal[1]);

  rnd = Math.random;
  return { W: w, H: h, hedges: hd, doors: dr, mushrooms: ms, guards: gs, coins: cs, tarts: ts, cats: ct, decor: dc, path: pth, hole: hl, tops: tp, bottoms: bt, patches: pt, ground: gg };
}

/* ---------- level flow ---------- */
function startLevel(){
  audioInit();
  $('titleScreen').classList.remove('show');
  world = buildLevel(S.level);
  ({ W, H, hedges, doors, mushrooms, guards, coins, tarts, cats, decor, path, hole, tops, bottoms, patches } = world);
  Object.assign(player, { x: 110, y: H / 2, scale: 1, small: false, facing: 1, walk: 0, moving: false, running: false, tired: false, stam: 100, wand: 3, wandT: 0, inv: 0, say: null });
  rabbit = { x: 230, y: H / 2, wp: 1, facing: 1, hopT: 0, moving: false, say: null, sayCd: 3.5, inHole: false, diveT: 0 };
  particles = []; floaters = []; rings = []; fireflies = [];
  S.levelStartCoins = S.coins; S.levelStartHearts = S.hearts; S.fallT = 0;
  store.set('save', { level: S.level, coins: S.coins });
  for (const k in keys) keys[k] = false;
  runHeld = false; pad.x = pad.y = 0;
  setMode('playing');
  resize();
  updateCamera(0, true);
  speak(rabbit, 'Oh dear! I shall be too late! Follow me, Esme!', 3.6);
  updateHUD(true);
  const b = $('banner');
  $('bannerTitle').textContent = 'Glade ' + S.level;
  $('bannerSub').textContent = gladeName(S.level);
  b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  last = performance.now();
}

function startFalling(){
  setMode('falling'); S.fallT = 0;
  if (!rabbit.inHole) { rabbit.inHole = true; rabbit.diveT = 0; }
  sfx.win();
  burst(hole.x, hole.y - 10, SPARK, 30, 220);
}

function levelDone(){
  setMode('levelDone');
  const found = S.coins - S.levelStartCoins;
  const healed = S.hearts < MAXH;
  if (healed) S.hearts++;
  saveBest();
  store.set('save', { level: S.level + 1, coins: S.coins });
  updateHUD();
  showPanel(`<h2>Down the rabbit hole</h2><p>${gladeName(S.level)}, done.</p>
    <div class="stats"><div class="stat"><b>${found}</b><span>coins here</span></div><div class="stat"><b>${S.coins}</b><span>total coins</span></div><div class="stat"><b>${S.hearts}/${MAXH}</b><span>hearts</span></div></div>
    <p class="aside">${healed ? 'One heart back for the fall. ' : ''}${pickM(DONE_LINES)}</p>
    <button class="btn" data-act="next">Next glade</button>`);
}

function gameOver(){
  setMode('over'); sfx.lose(); saveBest();
  showPanel(`<h2>The cards caught up</h2><p>You reached ${gladeName(S.level)} with ${S.coins} coins.</p>
    <button class="btn" data-act="retry">Try this glade again</button>
    <button class="btn quiet" data-act="title">Back to the title</button>`);
}

function saveBest(){
  const b = store.get('best', { level: 0, coins: 0 });
  store.set('best', { level: Math.max(b.level, S.level), coins: Math.max(b.coins, S.coins) });
}

function pause(){
  if (S.mode !== 'playing') return;
  setMode('paused');
  showPanel(`<h2>Paused</h2><p>${gladeName(S.level)}</p>
    <button class="btn" data-act="resume">Keep playing</button>
    <button class="btn quiet" data-act="restart">Restart this glade</button>
    <button class="btn quiet" data-act="title">Back to the title</button>`);
}
function resume(){ hidePanel(); setMode('playing'); last = performance.now(); }

function toTitle(){
  hidePanel(); setMode('title'); world = null;
  const save = store.get('save', null), best = store.get('best', null);
  const cb = $('contBtn');
  if (save && save.level > 1) { cb.hidden = false; cb.textContent = 'Continue at Glade ' + save.level; } else cb.hidden = true;
  const bl = $('bestLine');
  if (best && best.level > 0) { bl.hidden = false; bl.textContent = `Best so far: Glade ${best.level}, ${best.coins} coins.`; } else bl.hidden = true;
  $('titleScreen').classList.add('show');
  setTimeout(() => $('playBtn').focus({ preventScroll: true }), 50);
}

const panel = $('panel'), panelCard = $('panelCard');
function showPanel(html){ panelCard.innerHTML = html; panel.classList.add('show'); const b = panelCard.querySelector('button'); if (b) setTimeout(() => b.focus({ preventScroll: true }), 60); }
function hidePanel(){ panel.classList.remove('show'); }
const actions = {
  next(){ hidePanel(); S.level++; startLevel(); },
  retry(){ hidePanel(); S.hearts = MAXH; S.coins = S.levelStartCoins; startLevel(); },
  restart(){ hidePanel(); S.hearts = S.levelStartHearts; S.coins = S.levelStartCoins; startLevel(); },
  resume(){ resume(); },
  title(){ toTitle(); }
};
panelCard.addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b && actions[b.dataset.act]) actions[b.dataset.act](); });

$('playBtn').addEventListener('click', () => { $('titleScreen').classList.remove('show'); S.level = 1; S.coins = 0; S.hearts = MAXH; startLevel(); });
$('contBtn').addEventListener('click', () => {
  const save = store.get('save', null); if (!save) return;
  $('titleScreen').classList.remove('show'); S.level = save.level; S.coins = save.coins; S.hearts = MAXH; startLevel();
});

/* ---------- speech & fx ---------- */
function speak(ent, text, dur){ ent.say = { text, t: dur || 2.6, max: dur || 2.6 }; }
function burst(x, y, colors, n, spd, kind){
  for (let i = 0; i < n && particles.length < 500; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * (spd || 160);
    const life = 0.5 + Math.random() * 0.6;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (kind === 'confetti' ? 80 : 20), life, max: life,
      c: colors[i % colors.length], size: kind === 'confetti' ? 4 + Math.random() * 3 : 3 + Math.random() * 4, kind: kind || 'spark', rot: Math.random() * 6, vr: (Math.random() - .5) * 14 });
  }
}
function addCoins(n, x, y){ S.coins += n; floaters.push({ x, y, text: '+' + n, t: 0, life: 0.9 }); }

/* ---------- input ---------- */
const keys = {};
let runHeld = false;
const pad = { x: 0, y: 0 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ShiftLeft: 'run', ShiftRight: 'run' };
window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (S.mode === 'playing') {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; e.preventDefault(); return; }
    if (e.code === 'Space' || e.code === 'KeyJ') { if (!e.repeat) castWand(); e.preventDefault(); return; }
    if (e.code === 'KeyE' || e.code === 'KeyK' || e.code === 'KeyQ') { if (!e.repeat) toggleShrink(); e.preventDefault(); return; }
    if (e.code === 'Escape' || e.code === 'KeyP') { pause(); e.preventDefault(); }
  } else if (S.mode === 'paused' && (e.code === 'Escape' || e.code === 'KeyP')) { resume(); e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; runHeld = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

const dpad = $('dpad'), knob = $('knob');
let padId = null;
function padMove(e){
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), full = r.width * 0.16;
  if (m < 5) { pad.x = pad.y = 0; }
  else { const k = Math.min(1, m / full); pad.x = dx / m * k; pad.y = dy / m * k; }
  knob.setAttribute('transform', `translate(${pad.x * 16} ${pad.y * 16})`);
}
dpad.addEventListener('pointerdown', e => { audioInit(); padId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} padMove(e); e.preventDefault(); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => dpad.addEventListener(t, e => {
  if (e.pointerId === padId) { padId = null; pad.x = pad.y = 0; knob.setAttribute('transform', ''); }
}));
const runBtn = $('runBtn'), shrinkBtn = $('shrinkBtn'), wandBtn = $('wandBtn');
runBtn.addEventListener('pointerdown', e => { runHeld = true; runBtn.classList.add('held'); try { runBtn.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => runBtn.addEventListener(t, () => { runHeld = false; runBtn.classList.remove('held'); }));
runBtn.addEventListener('contextmenu', e => e.preventDefault());
shrinkBtn.addEventListener('pointerdown', e => { e.preventDefault(); toggleShrink(); });
wandBtn.addEventListener('pointerdown', e => { e.preventDefault(); castWand(); });
shrinkBtn.addEventListener('keydown', e => { if (e.code === 'Enter') toggleShrink(); });
wandBtn.addEventListener('keydown', e => { if (e.code === 'Enter') castWand(); });
$('pauseBtn').addEventListener('click', pause);
const muteBtn = $('muteBtn');
function drawMute(){

/* ---------- update ---------- */

function updatePlayer(dt){

function ell(x, y, rx, ry, fill){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

function drawGround(){

    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = 'rgba(214,170,255,.18)'; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c58bff'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffe6f6'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, r.y, rad - 9, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // particles
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.size / 2, -p.size, p.size, p.size * 2); ctx.restore(); }
    else if (p.kind === 'dust') circ(p.x, p.y, p.size * (1.4 - p.life / p.max * 0.6), p.c);
    else { ctx.fillStyle = p.c; star4(p.x, p.y, p.size); }
  }
  ctx.globalAlpha = 1;
  // fireflies
  for (const f of fireflies) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(f.ph * 2));
    circ(f.x, f.y, 6, 'rgba(255,250,170,' + (a * 0.18) + ')'); circ(f.x, f.y, 2, 'rgba(255,252,210,' + a + ')');
  }
  // floaters
  ctx.font = '700 20px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(1 - f.t / f.life, 0, 1);
    ctx.strokeStyle = '#6b3d18'; ctx.lineWidth = 5; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = '#ffe066'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  // speech
  const headH = { player: 82, rabbit: 76, cat: 40, guard: 86 };
  if (player.say && S.mode === 'playing' && inView(player.x, player.y, 0)) drawBubble(player.x, player.y - headH.player * player.scale, player.say);
  if (rabbit.say && !(rabbit.inHole && rabbit.diveT >= 1) && inView(rabbit.x, rabbit.y, 0)) drawBubble(rabbit.x, rabbit.y - headH.rabbit, rabbit.say);
  for (const c of cats) if (c.say && c.a > 0.3 && inView(c.x, c.y, 0)) drawBubble(c.x + 18, c.y - headH.cat, c.say);
  for (const g of guards) if (g.say && !g.zap && inView(g.x, g.y, 0)) drawBubble(g.x, g.y - headH.guard, g.say);
  ctx.restore();
  // screen space
  ctx.fillStyle = glow; ctx.fillRect(0, 0, vw, vh);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, vw, vh);
  drawIndicator();
}

/* ---------- loop & sizing ---------- */
function resize(){
  const r = cvs.getBoundingClientRect();
  vw = Math.max(1, r.width); vh = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(vw * dpr); cvs.height = Math.round(vh * dpr);
  zoom = clamp(Math.max(vw, vh) / 920, 0.62, 1.3);
  vignette = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.35, vw / 2, vh / 2, Math.max(vw, vh) * 0.78);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(4,30,20,.55)');
  glow = ctx.createRadialGradient(vw / 2, vh * 0.25, 0, vw / 2, vh * 0.25, Math.max(vw, vh) * 0.6);
  glow.addColorStop(0, 'rgba(150,255,230,.12)'); glow.addColorStop(1, 'rgba(150,255,230,0)');
  if (world) updateCamera(0, true);
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  S.t += dt;
  if (S.mode === 'playing') update(dt);
  else if (S.mode === 'falling') {
    S.fallT += dt;
    player.x += (hole.x - player.x) * Math.min(1, dt * 8); player.y += (hole.y - player.y) * Math.min(1, dt * 8);
    updateCamera(dt, false);
    if (S.fallT > 1.0) levelDone();
  }
  if (world && S.mode !== 'paused') updateFx(dt);
  render();
  requestAnimationFrame(frame);
}

$('titleBg').style.backgroundImage = `url(${$('titleArt').src})`;
resize();
toTitle();
requestAnimationFrame(frame);
})();
</script>
